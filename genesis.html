<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>放置天堂－創世全能師</title>
<style>
html,body,#game{margin:0;width:100%;height:100%;border:0;overflow:hidden;background:#020617}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#020617;color:#fde68a;font:700 20px system-ui,sans-serif;z-index:5}
</style>
</head>
<body>
<div id="loading">正在載入創世全能師……</div>
<iframe id="game" src="index.html?genesis=1" title="放置天堂－創世全能師"></iframe>
<script>
(function(){
  const frame=document.getElementById('game');
  const loading=document.getElementById('loading');
  frame.addEventListener('load',function(){
    try{
      const doc=frame.contentDocument;
      const script=doc.createElement('script');
      script.src='js/99-genesis-omni.js?v=1.2.0';
      script.onload=function(){loading.remove();};
      script.onerror=function(){loading.textContent='創世模組載入失敗，請按 Ctrl+F5 後重試。';};
      doc.body.appendChild(script);
    }catch(e){loading.textContent='遊戲啟動失敗：'+e.message;}
  });
})();
</script>
</body>
</html>
